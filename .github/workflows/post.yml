# CHANGES 2026-11-28: reels every 2 hours from 08:00 Perth (was hourly), at least 60 min apart; 20:00 is a spare run.
name: Post to Instagram
on:
  schedule:
    - cron: '0 0-12/2 * * *'     # every 2 hours 08:00-20:00 Perth: one reel per run (one block per day; 20:00 is a spare)
    - cron: '30 4 * * *'         # 12:30 Perth: carousel for the previous day's block (if one is ready)
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = test the setup only, audio = list trending music, post = post the next reel of todays block, test = post one file, carousel = post the next due carousel (or the folder named below)'
        default: 'check'
        type: choice
        options: [check, post, test, carousel, audio]
      file:
        description: 'test mode: queue file name (e.g. 186 PP-01.01 What is an ODE_rev20261124_a.mp4). carousel mode: optional folder name in carousels/'
        required: false
concurrency: instagram-post
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Post
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          COVER_BASE_URL: ${{ vars.COVER_BASE_URL }}
          USE_IG_AUDIO: ${{ vars.USE_IG_AUDIO }}
          MIN_GAP_MINUTES: '60'
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then if [ "${{ github.event.schedule }}" = "30 4 * * *" ]; then MODE=carousel; else MODE=post; fi; fi
          if [ "$MODE" = "carousel" ]; then python post.py carousel "${{ github.event.inputs.file }}"
          elif [ "$MODE" = "test" ]; then python post.py test "${{ github.event.inputs.file }}"; else python post.py "$MODE"; fi
      - name: Save the post log
        if: always()
        run: |
          git config user.name "mayfair-poster"; git config user.email "actions@users.noreply.github.com"
          git add posted.csv 2>/dev/null || true; git add audio_trending.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Post log $(date -u +%F)" && git push)
