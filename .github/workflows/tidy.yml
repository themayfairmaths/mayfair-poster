name: Tidy files (one-off)
on:
  push:
    paths: ['.github/workflows/tidy.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move the files into the right folders, then delete this job
        run: |
          set -e
          git config user.name "mayfair-poster"; git config user.email "actions@users.noreply.github.com"
          for f in "006 WV-01.01 One drop" "023 WV-01.02 Two sources" "040 WV-01.03 Noise cancelling" "057 WV-01.04 Double slit" "070 WV-01.05 Single slit"; do
            for e in mp4 txt; do
              if [ -f "$f.$e" ]; then git mv -f "$f.$e" "queue/$f.$e"; echo "moved $f.$e -> queue/"; fi
            done
          done
          mkdir -p carousels/RD-02-deep-dive
          for f in slide01.jpg slide02.jpg slide03.jpg slide04.jpg slide05.jpg slide06.jpg slide07.jpg slide08.jpg slide09.jpg caption.txt; do
            if [ -f "$f" ]; then git mv -f "$f" "carousels/RD-02-deep-dive/$f"; echo "moved $f -> carousels/RD-02-deep-dive/"; fi
            if [ -f "carousels/$f" ]; then
              if [ -f "carousels/RD-02-deep-dive/$f" ]; then git rm -q "carousels/$f"; echo "removed duplicate carousels/$f"
              else git mv "carousels/$f" "carousels/RD-02-deep-dive/$f"; echo "moved carousels/$f -> carousels/RD-02-deep-dive/"; fi
            fi
          done
          git rm -q .github/workflows/tidy.yml
          git commit -m "Tidy: reels into queue/, RD-02 slides into carousels/RD-02-deep-dive/"
          git pull --rebase -q || true
          git push
          echo "Done:"; ls queue | grep -E "^(006|023|040|057|070) "; ls carousels/RD-02-deep-dive
